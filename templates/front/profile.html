<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 智能命题辅助系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="/static/css/front.css">
</head>
<body>
    <div id="app">
        <front-layout :active-menu="activeMenu">
            <div class="profile-container">
                <div class="container">
                    <el-row :gutter="30">
                        <el-col :xs="24" :md="8">
                            <el-card class="profile-card">
                                <div class="profile-header">
                                    <div class="avatar-container">
                                        <el-avatar :size="120" :src="userInfo.avatar || '/static/image/profile.png'"></el-avatar>
                                        <el-upload
                                            class="avatar-uploader"
                                            :action="uploadUrl"
                                            :show-file-list="false"
                                            :on-success="handleAvatarSuccess"
                                            :before-upload="beforeAvatarUpload">
                                            <div class="avatar-upload-trigger">
                                                <i class="el-icon-camera"></i>
                                                <span>更换头像</span>
                                            </div>
                                        </el-upload>
                                    </div>
                                    <div class="user-info">
                                        <h2>{{ userInfo.nickname || userInfo.username }}</h2>
                                        <p>{{ getRoleText(userInfo.role) }} / {{ userInfo.class_name || '未绑定班级' }}</p>
                                    </div>
                                </div>

                                <div class="profile-stats">
                                    <div class="stat-item">
                                        <div class="stat-icon"><i class="el-icon-message"></i></div>
                                        <div class="stat-info">
                                            <span class="stat-value">{{ userInfo.email || '未设置' }}</span>
                                            <span class="stat-label">邮箱</span>
                                        </div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-icon"><i class="el-icon-phone"></i></div>
                                        <div class="stat-info">
                                            <span class="stat-value">{{ userInfo.phone || '未设置' }}</span>
                                            <span class="stat-label">手机号</span>
                                        </div>
                                    </div>
                                </div>
                            </el-card>
                        </el-col>

                        <el-col :xs="24" :md="16">
                            <el-card class="edit-card">
                                <div slot="header" class="card-header">
                                    <span>个人信息</span>
                                    <el-button type="primary" @click="saveProfile" :loading="saveLoading">保存修改</el-button>
                                </div>

                                <el-form :model="profileForm" :rules="profileRules" ref="profileForm" label-width="100px">
                                    <el-row :gutter="20">
                                        <el-col :span="12">
                                            <el-form-item label="用户名">
                                                <el-input v-model="profileForm.username" disabled></el-input>
                                            </el-form-item>
                                        </el-col>
                                        <el-col :span="12">
                                            <el-form-item label="真实姓名" prop="nickname">
                                                <el-input v-model="profileForm.nickname"></el-input>
                                            </el-form-item>
                                        </el-col>
                                    </el-row>

                                    <el-row :gutter="20">
                                        <el-col :span="12">
                                            <el-form-item label="邮箱" prop="email">
                                                <el-input v-model="profileForm.email"></el-input>
                                            </el-form-item>
                                        </el-col>
                                        <el-col :span="12">
                                            <el-form-item label="手机号" prop="phone">
                                                <el-input v-model="profileForm.phone"></el-input>
                                            </el-form-item>
                                        </el-col>
                                    </el-row>

                                    <el-row :gutter="20">
                                        <el-col :span="12">
                                            <el-form-item label="班级" prop="class_name">
                                                <el-select
                                                    v-model="profileForm.class_name"
                                                    filterable
                                                    default-first-option
                                                    placeholder="请选择班级"
                                                    style="width: 100%;">
                                                    <el-option
                                                        v-for="item in classOptions"
                                                        :key="item.id"
                                                        :label="item.class_name"
                                                        :value="item.class_name">
                                                    </el-option>
                                                </el-select>
                                            </el-form-item>
                                        </el-col>
                                        <el-col :span="12">
                                            <el-form-item label="性别">
                                                <el-select v-model="profileForm.sex" placeholder="选择性别">
                                                    <el-option label="男" value="男"></el-option>
                                                    <el-option label="女" value="女"></el-option>
                                                </el-select>
                                            </el-form-item>
                                        </el-col>
                                    </el-row>

                                    <el-row :gutter="20">
                                        <el-col :span="12">
                                            <el-form-item label="年龄">
                                                <el-input-number v-model="profileForm.age" :min="1" :max="120"></el-input-number>
                                            </el-form-item>
                                        </el-col>
                                        <el-col :span="12">
                                            <el-form-item label="生日">
                                                <el-date-picker
                                                    v-model="profileForm.birthday"
                                                    type="date"
                                                    placeholder="选择生日"
                                                    format="yyyy-MM-dd"
                                                    value-format="yyyy-MM-dd">
                                                </el-date-picker>
                                            </el-form-item>
                                        </el-col>
                                    </el-row>

                                    <el-row :gutter="20">
                                        <el-col :span="12">
                                            <el-form-item label="学历">
                                                <el-select v-model="profileForm.education" placeholder="选择学历">
                                                    <el-option label="小学" value="小学"></el-option>
                                                    <el-option label="初中" value="初中"></el-option>
                                                    <el-option label="高中" value="高中"></el-option>
                                                    <el-option label="大专" value="大专"></el-option>
                                                    <el-option label="本科" value="本科"></el-option>
                                                    <el-option label="硕士" value="硕士"></el-option>
                                                    <el-option label="博士" value="博士"></el-option>
                                                </el-select>
                                            </el-form-item>
                                        </el-col>
                                        <el-col :span="12">
                                            <el-form-item label="职业">
                                                <el-input v-model="profileForm.profession"></el-input>
                                            </el-form-item>
                                        </el-col>
                                    </el-row>

                                    <el-row :gutter="20">
                                        <el-col :span="12">
                                            <el-form-item label="单位">
                                                <el-input v-model="profileForm.company"></el-input>
                                            </el-form-item>
                                        </el-col>
                                        <el-col :span="12">
                                            <el-form-item label="地址">
                                                <el-input v-model="profileForm.address"></el-input>
                                            </el-form-item>
                                        </el-col>
                                    </el-row>

                                    <el-form-item label="个人简介">
                                        <el-input v-model="profileForm.content" type="textarea" :rows="4" placeholder="请输入个人简介"></el-input>
                                    </el-form-item>
                                </el-form>
                            </el-card>
                        </el-col>
                    </el-row>
                </div>
            </div>
        </front-layout>
    </div>

    <script src="/static/js/vue.js"></script>
    <script src="/static/js/element-ui.min.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/config/layout-config.js"></script>
    <script src="/static/js/components/layout.js"></script>
    <script src="/static/js/config/theme-config.js"></script>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    activeMenu: 'profile',
                    userInfo: {},
                    classOptions: [],
                    saveLoading: false,
                    uploadUrl: '/open/upload',
                    profileForm: {
                        username: '',
                        nickname: '',
                        email: '',
                        phone: '',
                        sex: '',
                        age: null,
                        birthday: '',
                        education: '',
                        profession: '',
                        company: '',
                        address: '',
                        content: '',
                        class_name: ''
                    },
                    profileRules: {
                        nickname: [
                            { required: true, message: '请输入真实姓名', trigger: 'blur' }
                        ],
                        email: [
                            { type: 'email', message: '请输入正确的邮箱地址', trigger: 'blur' }
                        ],
                        phone: [
                            { pattern: /^1[3-9]\d{9}$/, message: '请输入正确的手机号', trigger: 'blur' }
                        ],
                        class_name: [
                            { required: true, message: '请选择或输入班级', trigger: 'change' }
                        ]
                    }
                };
            },
            mounted() {
                this.loadClassOptions();
                this.loadUserInfo();
            },
            methods: {
                loadClassOptions() {
                    axios.get('/api/class/options')
                        .then(response => {
                            if (response.data.code === 200) {
                                this.classOptions = response.data.data || [];
                            }
                        })
                        .catch(error => {
                            console.error('获取班级列表失败:', error);
                        });
                },
                loadUserInfo() {
                    axios.get('/api/user/profile')
                        .then(response => {
                            if (response.data.code === 200) {
                                this.userInfo = response.data.data;
                                this.profileForm = { ...this.profileForm, ...this.userInfo };
                            } else {
                                this.$message.error(response.data.message);
                            }
                        })
                        .catch(error => {
                            console.error('获取用户信息失败:', error);
                            this.$message.error('获取用户信息失败');
                        });
                },
                saveProfile() {
                    this.$refs.profileForm.validate((valid) => {
                        if (!valid) {
                            return;
                        }

                        const payload = { ...this.profileForm };
                        delete payload.class_id;
                        this.saveLoading = true;
                        axios.put(`/api/user/${this.userInfo.id}`, payload)
                            .then(response => {
                                if (response.data.code === 200) {
                                    this.$message.success(response.data.message);
                                    this.loadClassOptions();
                                    this.loadUserInfo();
                                } else {
                                    this.$message.error(response.data.message);
                                }
                            })
                            .catch(error => {
                                console.error('保存个人信息失败:', error);
                                this.$message.error('保存个人信息失败');
                            })
                            .finally(() => {
                                this.saveLoading = false;
                            });
                    });
                },
                handleAvatarSuccess(response) {
                    if (response.code === 200) {
                        this.userInfo.avatar = response.data.url;
                        this.$message.success('头像上传成功');
                        axios.put(`/api/user/${this.userInfo.id}`, {
                            avatar: response.data.url,
                            class_name: this.profileForm.class_name
                        }).then(() => {
                            this.loadUserInfo();
                            this.updateLocalUserInfo();
                        });
                    } else {
                        this.$message.error(response.message);
                    }
                },
                beforeAvatarUpload(file) {
                    const isJpgOrPng = file.type === 'image/jpeg' || file.type === 'image/png';
                    const isLt2M = file.size / 1024 / 1024 < 2;
                    if (!isJpgOrPng) {
                        this.$message.error('上传头像图片只能是 JPG/PNG 格式');
                    }
                    if (!isLt2M) {
                        this.$message.error('上传头像图片大小不能超过 2MB');
                    }
                    return isJpgOrPng && isLt2M;
                },
                getRoleText(role) {
                    const roleMap = {
                        admin: '管理员',
                        doctor: '教师',
                        user: '学生'
                    };
                    return roleMap[role] || role;
                },
                updateLocalUserInfo() {
                    const userInfoStr = JSON.stringify(this.userInfo);
                    localStorage.setItem('userInfo', userInfoStr);
                    sessionStorage.setItem('userInfo', userInfoStr);
                    window.dispatchEvent(new CustomEvent('userInfoUpdated', {
                        detail: { userInfo: this.userInfo }
                    }));
                }
            }
        });
    </script>
</body>
</html>
