<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>药品管理 - 后台考试系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        .page-container { padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #e6e6e6; }
        .page-header h2 { margin: 0; color: #333; font-size: 24px; font-weight: 600; }
        .table-card { margin-top: 20px; }
        .pagination-container { margin-top: 20px; text-align: center; }
        .image-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; border: 1px solid #eee; }
        .form-tip { margin-left: 10px; color: #999; font-size: 12px; }
    </style>
    <script>
        // 简单的本地价格/库存校验（字符串存储）
        function normalizeNumberString(value) {
            if (value === null || value === undefined) return '';
            return String(value).trim();
        }
    </script>
    </head>
<body>
    <div id="app">
        <admin-layout :active-menu="activeMenu">
            <template #content>
                <div class="page-container">
                    <div class="page-header">
                        <h2>药品管理</h2>
                        <div class="page-actions">
                            <el-button type="primary" @click="showCreateDialog">
                                <i class="el-icon-plus"></i> 新增药品
                            </el-button>
                        </div>
                    </div>

                    <!-- 搜索筛选 -->
                    <el-card>
                        <el-form :inline="true" :model="searchForm" class="search-form">
                            <el-form-item label="关键词">
                                <el-input v-model="searchForm.keyword" placeholder="名称/通用名/编码/条码/厂家" clearable @keyup.enter.native="handleSearch"></el-input>
                            </el-form-item>
                            <el-form-item label="分类">
                                <el-input v-model="searchForm.category" placeholder="请输入分类" clearable @keyup.enter.native="handleSearch"></el-input>
                            </el-form-item>
                            <el-form-item label="状态">
                                <el-select v-model="searchForm.status" placeholder="请选择" clearable style="width: 160px;">
                                    <el-option label="全部" value=""></el-option>
                                    <el-option label="启用" value="enabled"></el-option>
                                    <el-option label="禁用" value="disabled"></el-option>
                                </el-select>
                            </el-form-item>
                            <el-form-item>
                                <el-button type="primary" @click="handleSearch"><i class="el-icon-search"></i> 搜索</el-button>
                                <el-button @click="handleReset"><i class="el-icon-refresh"></i> 重置</el-button>
                            </el-form-item>
                        </el-form>
                    </el-card>

                    <!-- 表格 -->
                    <el-card class="table-card">
                        <el-table :data="tableData" v-loading="loading" stripe style="width: 100%">
                            <el-table-column prop="id" label="ID" width="70" align="center"></el-table-column>
                            <el-table-column label="图片" width="70" align="center">
                                <template slot-scope="scope">
                                    <img v-if="scope.row.imageUrl" :src="scope.row.imageUrl" class="image-thumb" />
                                    <span v-else style="color:#bbb;">无</span>
                                </template>
                            </el-table-column>
                            <el-table-column prop="drugName" label="名称" min-width="140" show-overflow-tooltip></el-table-column>
                            <el-table-column prop="genericName" label="通用名" min-width="120" show-overflow-tooltip></el-table-column>
                            <el-table-column prop="code" label="编码" min-width="120" show-overflow-tooltip></el-table-column>
                            <el-table-column prop="barcode" label="条码" min-width="120" show-overflow-tooltip></el-table-column>
                            <el-table-column prop="category" label="分类" min-width="100" show-overflow-tooltip></el-table-column>
                            <el-table-column prop="dosageForm" label="剂型" min-width="90" show-overflow-tooltip></el-table-column>
                            <el-table-column prop="specification" label="规格" min-width="120" show-overflow-tooltip></el-table-column>
                            <el-table-column prop="unit" label="单位" width="70" align="center"></el-table-column>
                            <el-table-column prop="manufacturer" label="厂家" min-width="160" show-overflow-tooltip></el-table-column>
                            <el-table-column prop="price" label="价格(元)" width="100" align="right"></el-table-column>
                            <el-table-column prop="stock" label="库存" width="90" align="right"></el-table-column>
                            <el-table-column prop="status" label="状态" width="100" align="center">
                                <template slot-scope="scope">
                                    <el-tag :type="scope.row.status === 'enabled' ? 'success' : 'info'" size="small">
                                        {{ scope.row.status === 'enabled' ? '启用' : '禁用' }}
                                    </el-tag>
                                </template>
                            </el-table-column>
                            <el-table-column label="操作" align="center" fixed="right" width="280">
                                <template slot-scope="scope">
                                    <el-button size="mini" type="primary" @click="handleEdit(scope.row)">编辑</el-button>
                                    <el-button size="mini" type="danger" @click="handleDelete(scope.row)">删除</el-button>
                                    <el-button size="mini" @click="handleToggleStatus(scope.row)">
                                        {{ scope.row.status === 'enabled' ? '禁用' : '启用' }}
                                    </el-button>
                                </template>
                            </el-table-column>
                        </el-table>
                        <div class="pagination-container">
                            <el-pagination
                                @size-change="handleSizeChange"
                                @current-change="handleCurrentChange"
                                :current-page="pagination.pageNum"
                                :page-sizes="[10, 20, 50, 100]"
                                :page-size="pagination.pageSize"
                                layout="total, sizes, prev, pager, next, jumper"
                                :total="pagination.total">
                            </el-pagination>
                        </div>
                    </el-card>
                </div>

                <!-- 新增/编辑对话框 -->
                <el-dialog :title="dialogTitle" :visible.sync="dialogVisible" width="60%" :close-on-click-modal="false">
                    <el-form :model="formData" :rules="formRules" ref="formRef" label-width="110px">
                        <el-row :gutter="16">
                            <el-col :span="12">
                                <el-form-item label="药品名称" prop="drugName">
                                    <el-input v-model="formData.drugName" maxlength="100" show-word-limit></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="通用名">
                                    <el-input v-model="formData.genericName" maxlength="100" show-word-limit></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="编码">
                                    <el-input v-model="formData.code" maxlength="50"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="条形码">
                                    <el-input v-model="formData.barcode" maxlength="50"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="分类">
                                    <el-input v-model="formData.category" maxlength="50"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="剂型">
                                    <el-input v-model="formData.dosageForm" maxlength="50"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="规格">
                                    <el-input v-model="formData.specification" maxlength="100"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="单位">
                                    <el-input v-model="formData.unit" maxlength="20"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="厂家">
                                    <el-input v-model="formData.manufacturer" maxlength="100"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="批准文号">
                                    <el-input v-model="formData.approvalNumber" maxlength="100"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="价格(元)">
                                    <el-input v-model="formData.price" placeholder="示例：18.90（字符串存储）"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="库存">
                                    <el-input v-model="formData.stock" placeholder="示例：200（字符串存储）"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="状态">
                                    <el-select v-model="formData.status" style="width: 100%;">
                                        <el-option label="启用" value="enabled"></el-option>
                                        <el-option label="禁用" value="disabled"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="药品图片">
                                    <div style="display:flex;align-items:center;gap:12px;">
                                        <img v-if="formData.imageUrl" :src="formData.imageUrl" class="image-thumb" />
                                        <el-upload
                                            class="avatar-uploader"
                                            :action="uploadUrl"
                                            :show-file-list="false"
                                            :on-success="handleImageSuccess"
                                            :before-upload="beforeImageUpload">
                                            <div class="avatar-upload-trigger">
                                                <i class="el-icon-camera"></i>
                                                <span>{{ formData.imageUrl ? '更换图片' : '上传图片' }}</span>
                                            </div>
                                        </el-upload>
                                        <span class="form-tip">支持 jpg/png，≤ 2MB</span>
                                    </div>
                                </el-form-item>
                            </el-col>
                            <el-col :span="24">
                                <el-form-item label="备注">
                                    <el-input v-model="formData.remark" type="textarea" :rows="3" maxlength="200" show-word-limit></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>
                    </el-form>
                    <div slot="footer" class="dialog-footer">
                        <el-button @click="dialogVisible = false">取消</el-button>
                        <el-button type="primary" @click="handleSubmit" :loading="submitLoading">确定</el-button>
                    </div>
                </el-dialog>
            </template>
        </admin-layout>
    </div>

    <script src="/static/js/vue.js"></script>
    <script src="/static/js/element-ui.min.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/config/layout-config.js"></script>
    <script src="/static/js/components/layout.js"></script>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    activeMenu: 'drugs',
                    loading: false,
                    submitLoading: false,
                    uploadUrl: '/open/upload',
                    dialogVisible: false,
                    dialogTitle: '新增药品',
                    isEdit: false,
                    tableData: [],
                    searchForm: {
                        keyword: '',
                        status: '',
                        category: ''
                    },
                    pagination: {
                        pageNum: 1,
                        pageSize: 10,
                        total: 0
                    },
                    formData: {
                        id: null,
                        drugName: '',
                        genericName: '',
                        code: '',
                        barcode: '',
                        category: '',
                        dosageForm: '',
                        specification: '',
                        unit: '',
                        manufacturer: '',
                        approvalNumber: '',
                        price: '',
                        stock: '',
                        status: 'enabled',
                        remark: '',
                        imageUrl: ''
                    },
                    formRules: {
                        drugName: [
                            { required: true, message: '请输入药品名称', trigger: 'blur' },
                            { min: 1, max: 100, message: '长度 1-100', trigger: 'blur' }
                        ]
                    }
                }
            },
            mounted() {
                this.loadData();
            },
            methods: {
                loadData() {
                    this.loading = true;
                    const params = {
                        pageNum: this.pagination.pageNum,
                        pageSize: this.pagination.pageSize,
                        keyword: this.searchForm.keyword,
                        status: this.searchForm.status,
                        category: this.searchForm.category
                    };
                    axios.get('/api/drug/admin/list', { params })
                        .then(res => {
                            if (res.data.code === 200) {
                                this.tableData = res.data.data.rows;
                                this.pagination.total = res.data.data.total;
                            } else {
                                this.$message.error(res.data.message || '加载失败');
                            }
                        })
                        .catch(() => this.$message.error('加载失败'))
                        .finally(() => this.loading = false);
                },
                handleSearch() {
                    this.pagination.pageNum = 1;
                    this.loadData();
                },
                handleReset() {
                    this.searchForm = { keyword: '', status: '', category: '' };
                    this.pagination.pageNum = 1;
                    this.loadData();
                },
                handleSizeChange(val) {
                    this.pagination.pageSize = val;
                    this.pagination.pageNum = 1;
                    this.loadData();
                },
                handleCurrentChange(val) {
                    this.pagination.pageNum = val;
                    this.loadData();
                },
                showCreateDialog() {
                    this.dialogTitle = '新增药品';
                    this.isEdit = false;
                    this.formData = {
                        id: null,
                        drugName: '',
                        genericName: '',
                        code: '',
                        barcode: '',
                        category: '',
                        dosageForm: '',
                        specification: '',
                        unit: '',
                        manufacturer: '',
                        approvalNumber: '',
                        price: '',
                        stock: '',
                        status: 'enabled',
                        remark: '',
                        imageUrl: ''
                    };
                    this.dialogVisible = true;
                    this.$nextTick(() => this.$refs.formRef && this.$refs.formRef.clearValidate());
                },
                handleEdit(row) {
                    this.dialogTitle = '编辑药品';
                    this.isEdit = true;
                    this.formData = { ...row };
                    this.dialogVisible = true;
                    this.$nextTick(() => this.$refs.formRef && this.$refs.formRef.clearValidate());
                },
                handleSubmit() {
                    if (!this.$refs.formRef) return;
                    this.$refs.formRef.validate(valid => {
                        if (!valid) return;
                        this.submitLoading = true;
                        const url = this.isEdit ? '/api/drug/admin/update' : '/api/drug/admin/create';
                        axios.post(url, this.formData)
                            .then(res => {
                                if (res.data.code === 200) {
                                    this.$message.success(res.data.message);
                                    this.dialogVisible = false;
                                    this.loadData();
                                } else {
                                    this.$message.error(res.data.message || '提交失败');
                                }
                            })
                            .catch(() => this.$message.error('提交失败'))
                            .finally(() => this.submitLoading = false);
                    });
                },
                handleToggleStatus(row) {
                    const text = row.status === 'enabled' ? '禁用' : '启用';
                    this.$confirm(`确定要${text}该药品吗？`, '提示', { type: 'warning' })
                        .then(() => {
                            axios.get('/api/drug/admin/toggle-status', { params: { id: row.id } })
                                .then(res => {
                                    if (res.data.code === 200) {
                                        this.$message.success(res.data.message);
                                        this.loadData();
                                    } else {
                                        this.$message.error(res.data.message || '操作失败');
                                    }
                                })
                                .catch(() => this.$message.error('操作失败'));
                        });
                },
                handleDelete(row) {
                    this.$confirm('确定要删除该药品吗？删除后不可恢复！', '警告', { type: 'error' })
                        .then(() => {
                            axios.get('/api/drug/admin/delete', { params: { id: row.id } })
                                .then(res => {
                                    if (res.data.code === 200) {
                                        this.$message.success(res.data.message);
                                        this.loadData();
                                    } else {
                                        this.$message.error(res.data.message || '删除失败');
                                    }
                                })
                                .catch(() => this.$message.error('删除失败'));
                        });
                },
                handleImageSuccess(response) {
                    if (response && response.code === 200) {
                        const url = (response.data && (response.data.url || response.data.path)) || response.url || response.data;
                        if (url) {
                            this.formData.imageUrl = url;
                            this.$message.success('图片上传成功');
                        } else {
                            this.$message.error('返回数据缺少文件地址');
                        }
                    } else {
                        this.$message.error((response && response.message) || '图片上传失败');
                    }
                },
                beforeImageUpload(file) {
                    const isJpgOrPng = file.type === 'image/jpeg' || file.type === 'image/png';
                    const isLt2M = file.size / 1024 / 1024 < 2;
                    if (!isJpgOrPng) {
                        this.$message.error('仅支持 JPG/PNG 格式图片');
                        return false;
                    }
                    if (!isLt2M) {
                        this.$message.error('图片大小不能超过 2MB');
                        return false;
                    }
                    return true;
                }
            }
        });
    </script>
</body>
</html>
