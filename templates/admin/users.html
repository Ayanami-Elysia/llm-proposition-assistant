<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 智能命题辅助系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <div id="app">
        <admin-layout :active-menu="activeMenu">
            <template #content>
                <div class="user-management-container">
                    <el-card class="search-card">
                        <el-form :model="searchForm" :inline="true" class="search-form">
                            <el-form-item label="关键词">
                                <el-input
                                    v-model="searchForm.keyword"
                                    placeholder="用户名/姓名/邮箱/班级"
                                    clearable>
                                </el-input>
                            </el-form-item>
                            <el-form-item label="角色" v-if="!isRoleFixed">
                                <el-select v-model="searchForm.role" placeholder="选择角色" clearable :disabled="isRoleFixed">
                                    <el-option label="全部" value=""></el-option>
                                    <el-option label="学生" value="user"></el-option>
                                    <el-option label="教师" value="doctor"></el-option>
                                    <el-option label="管理员" value="admin"></el-option>
                                </el-select>
                            </el-form-item>
                            <el-form-item label="状态">
                                <el-select v-model="searchForm.status" placeholder="选择状态" clearable>
                                    <el-option label="全部" value=""></el-option>
                                    <el-option label="正常" value="active"></el-option>
                                    <el-option label="锁定" value="locked"></el-option>
                                    <el-option label="禁用" value="disabled"></el-option>
                                </el-select>
                            </el-form-item>
                            <el-form-item>
                                <el-button type="primary" @click="searchUsers">搜索</el-button>
                                <el-button @click="resetSearch">重置</el-button>
                            </el-form-item>
                        </el-form>
                    </el-card>

                    <el-card class="table-card">
                        <div slot="header" class="card-header">
                            <span>用户列表</span>
                            <el-button type="primary" icon="el-icon-plus" @click="showAddDialog">添加用户</el-button>
                        </div>

                        <el-table :data="userList" v-loading="tableLoading" stripe style="width: 100%">
                            <el-table-column prop="id" label="ID" width="70"></el-table-column>
                            <el-table-column prop="username" label="用户名"></el-table-column>
                            <el-table-column prop="nickname" label="姓名"></el-table-column>
                            <el-table-column prop="avatar" label="头像" width="80">
                                <template #default="scope">
                                    <el-avatar :src="scope.row.avatar || '/static/image/profile.png'" size="small"></el-avatar>
                                </template>
                            </el-table-column>
                            <el-table-column prop="email" label="邮箱"></el-table-column>
                            <el-table-column prop="phone" label="手机号"></el-table-column>
                            <el-table-column prop="class_name" label="班级"></el-table-column>
                            <el-table-column prop="role" label="角色" width="100">
                                <template #default="scope">
                                    <el-tag :type="getRoleTagType(scope.row.role)" size="small">
                                        {{ getRoleText(scope.row.role) }}
                                    </el-tag>
                                </template>
                            </el-table-column>
                            <el-table-column prop="status" label="状态" width="100">
                                <template #default="scope">
                                    <el-tag :type="getStatusTagType(scope.row.status)" size="small">
                                        {{ getStatusText(scope.row.status) }}
                                    </el-tag>
                                </template>
                            </el-table-column>
                            <el-table-column prop="last_login_time" label="最后登录"></el-table-column>
                            <el-table-column prop="createtime" label="创建时间"></el-table-column>
                            <el-table-column label="操作" width="180" fixed="right">
                                <template #default="scope">
                                    <el-button type="text" size="small" @click="editUser(scope.row)">编辑</el-button>
                                    <el-button
                                        type="text"
                                        size="small"
                                        @click="deleteUser(scope.row)"
                                        style="color: #f56c6c;">
                                        删除
                                    </el-button>
                                </template>
                            </el-table-column>
                        </el-table>

                        <div class="pagination-container">
                            <el-pagination
                                @size-change="handleSizeChange"
                                @current-change="handleCurrentChange"
                                :current-page="pagination.pageNum"
                                :page-sizes="[10, 20, 50, 100]"
                                :page-size="pagination.pageSize"
                                layout="total, sizes, prev, pager, next, jumper"
                                :total="pagination.total">
                            </el-pagination>
                        </div>
                    </el-card>
                </div>

                <el-dialog
                    :title="dialogTitle"
                    :visible.sync="dialogVisible"
                    width="45%"
                    @close="resetForm">
                    <el-form
                        :model="userForm"
                        :rules="userRules"
                        ref="userForm"
                        label-width="100px">
                        <el-row :gutter="20">
                            <el-col :span="12">
                                <el-form-item label="用户名" prop="username">
                                    <el-input v-model="userForm.username" :disabled="isEdit"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12" v-if="!isEdit">
                                <el-form-item label="密码" prop="password">
                                    <el-input v-model="userForm.password" type="password"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>

                        <el-row :gutter="20">
                            <el-col :span="12">
                                <el-form-item label="姓名" prop="nickname">
                                    <el-input v-model="userForm.nickname"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="邮箱" prop="email">
                                    <el-input v-model="userForm.email"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>

                        <el-row :gutter="20">
                            <el-col :span="12">
                                <el-form-item label="手机号" prop="phone">
                                    <el-input v-model="userForm.phone"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="性别">
                                    <el-select v-model="userForm.sex" placeholder="选择性别">
                                        <el-option label="男" value="男"></el-option>
                                        <el-option label="女" value="女"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                        </el-row>

                        <el-row :gutter="20">
                            <el-col :span="12">
                                <el-form-item label="角色" prop="role">
                                    <el-select v-model="userForm.role" placeholder="选择角色" :disabled="isRoleFixed">
                                        <el-option label="学生" value="user"></el-option>
                                        <el-option label="教师" value="doctor"></el-option>
                                        <el-option label="管理员" value="admin"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="状态" prop="status">
                                    <el-select v-model="userForm.status" placeholder="选择状态">
                                        <el-option label="正常" value="active"></el-option>
                                        <el-option label="锁定" value="locked"></el-option>
                                        <el-option label="禁用" value="disabled"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                        </el-row>

                        <el-row :gutter="20">
                            <el-col :span="12">
                                <el-form-item label="班级" prop="class_name">
                                    <el-select
                                        v-model="userForm.class_name"
                                        filterable
                                        allow-create
                                        default-first-option
                                        placeholder="请选择或输入班级"
                                        :disabled="userForm.role === 'admin'"
                                        style="width: 100%;">
                                        <el-option
                                            v-for="item in classOptions"
                                            :key="item.id"
                                            :label="item.class_name"
                                            :value="item.class_name">
                                        </el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="年龄">
                                    <el-input v-model="userForm.age" type="number" placeholder="请输入年龄"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>

                        <el-row :gutter="20">
                            <el-col :span="12">
                                <el-form-item label="生日">
                                    <el-date-picker
                                        v-model="userForm.birthday"
                                        type="date"
                                        placeholder="选择生日"
                                        format="yyyy-MM-dd"
                                        value-format="yyyy-MM-dd">
                                    </el-date-picker>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="学历">
                                    <el-select v-model="userForm.education" placeholder="选择学历">
                                        <el-option label="小学" value="小学"></el-option>
                                        <el-option label="初中" value="初中"></el-option>
                                        <el-option label="高中" value="高中"></el-option>
                                        <el-option label="大专" value="大专"></el-option>
                                        <el-option label="本科" value="本科"></el-option>
                                        <el-option label="硕士" value="硕士"></el-option>
                                        <el-option label="博士" value="博士"></el-option>
                                    </el-select>
                                </el-form-item>
                            </el-col>
                        </el-row>

                        <el-row :gutter="20">
                            <el-col :span="12">
                                <el-form-item label="职业">
                                    <el-input v-model="userForm.profession" placeholder="请输入职业"></el-input>
                                </el-form-item>
                            </el-col>
                            <el-col :span="12">
                                <el-form-item label="单位">
                                    <el-input v-model="userForm.company" placeholder="请输入单位"></el-input>
                                </el-form-item>
                            </el-col>
                        </el-row>

                        <el-form-item label="地址">
                            <el-input v-model="userForm.address" placeholder="请输入地址"></el-input>
                        </el-form-item>

                        <el-form-item label="简介">
                            <el-input v-model="userForm.content" type="textarea" :rows="3" placeholder="请输入用户简介"></el-input>
                        </el-form-item>

                        <el-form-item label="备注">
                            <el-input v-model="userForm.remarks" type="textarea" :rows="2" placeholder="请输入备注"></el-input>
                        </el-form-item>
                    </el-form>

                    <div class="dialog-footer">
                        <el-button @click="dialogVisible = false">取消</el-button>
                        <el-button type="primary" @click="saveUser" :loading="saveLoading">确定</el-button>
                    </div>
                </el-dialog>
            </template>
        </admin-layout>
    </div>

    <script src="/static/js/vue.js"></script>
    <script src="/static/js/element-ui.min.js"></script>
    <script src="/static/js/axios.min.js"></script>
    <script src="/static/js/config/layout-config.js"></script>
    <script src="/static/js/components/layout.js"></script>
    <script>
        new Vue({
            el: '#app',
            data() {
                return {
                    activeMenu: 'users',
                    fixedRole: '',
                    classOptions: [],
                    searchForm: {
                        keyword: '',
                        role: '',
                        status: ''
                    },
                    userList: [],
                    tableLoading: false,
                    pagination: {
                        pageNum: 1,
                        pageSize: 10,
                        total: 0
                    },
                    dialogVisible: false,
                    dialogTitle: '添加用户',
                    isEdit: false,
                    saveLoading: false,
                    userForm: {
                        username: '',
                        password: '',
                        nickname: '',
                        email: '',
                        phone: '',
                        sex: '',
                        age: '',
                        birthday: '',
                        address: '',
                        education: '',
                        profession: '',
                        company: '',
                        class_name: '',
                        role: 'user',
                        status: 'active',
                        content: '',
                        remarks: ''
                    },
                    userRules: {
                        username: [
                            { required: true, message: '请输入用户名', trigger: 'blur' },
                            { min: 3, max: 20, message: '用户名长度在 3 到 20 个字符', trigger: 'blur' }
                        ],
                        password: [
                            { required: true, message: '请输入密码', trigger: 'blur' },
                            { min: 6, message: '密码长度不能少于 6 位', trigger: 'blur' }
                        ],
                        nickname: [
                            { required: true, message: '请输入姓名', trigger: 'blur' }
                        ],
                        email: [
                            { type: 'email', message: '请输入正确的邮箱地址', trigger: 'blur' }
                        ],
                        phone: [
                            { pattern: /^1[3-9]\d{9}$/, message: '请输入正确的手机号', trigger: 'blur' }
                        ],
                        role: [
                            { required: true, message: '请选择角色', trigger: 'change' }
                        ],
                        class_name: [
                            { validator: this.validateClassName, trigger: 'change' }
                        ],
                        status: [
                            { required: true, message: '请选择状态', trigger: 'change' }
                        ]
                    }
                };
            },
            mounted() {
                const roleFromQuery = this.getQueryParam('role');
                if (roleFromQuery) {
                    this.fixedRole = roleFromQuery;
                    this.searchForm.role = roleFromQuery;
                    if (roleFromQuery === 'doctor') {
                        this.activeMenu = 'doctors';
                    } else if (roleFromQuery === 'user') {
                        this.activeMenu = 'patients';
                    }
                }
                this.loadClassOptions();
                this.loadUserList();
            },
            methods: {
                getQueryParam(key) {
                    const params = new URLSearchParams(window.location.search || '');
                    return params.get(key);
                },
                loadClassOptions() {
                    axios.get('/api/class/options')
                        .then(response => {
                            if (response.data.code === 200) {
                                this.classOptions = response.data.data || [];
                            }
                        })
                        .catch(error => {
                            console.error('获取班级列表失败:', error);
                        });
                },
                loadUserList() {
                    this.tableLoading = true;
                    const params = {
                        pageNum: this.pagination.pageNum,
                        pageSize: this.pagination.pageSize,
                        ...this.searchForm
                    };
                    axios.get('/api/user/list', { params })
                        .then(response => {
                            if (response.data.code === 200) {
                                this.userList = response.data.data.rows;
                                this.pagination.total = response.data.data.total;
                            } else {
                                this.$message.error(response.data.message);
                            }
                        })
                        .catch(error => {
                            console.error('获取用户列表失败:', error);
                            this.$message.error('获取用户列表失败');
                        })
                        .finally(() => {
                            this.tableLoading = false;
                        });
                },
                searchUsers() {
                    this.pagination.pageNum = 1;
                    this.loadUserList();
                },
                resetSearch() {
                    this.searchForm = {
                        keyword: '',
                        role: this.fixedRole || '',
                        status: ''
                    };
                    this.pagination.pageNum = 1;
                    this.loadUserList();
                },
                handleSizeChange(size) {
                    this.pagination.pageSize = size;
                    this.pagination.pageNum = 1;
                    this.loadUserList();
                },
                handleCurrentChange(page) {
                    this.pagination.pageNum = page;
                    this.loadUserList();
                },
                validateClassName(rule, value, callback) {
                    if (this.userForm.role !== 'admin' && !value) {
                        callback(new Error('学生和教师必须绑定班级'));
                    } else {
                        callback();
                    }
                },
                showAddDialog() {
                    this.dialogTitle = '添加用户';
                    this.isEdit = false;
                    this.resetForm();
                    if (this.fixedRole) {
                        this.userForm.role = this.fixedRole;
                    }
                    this.dialogVisible = true;
                },
                editUser(user) {
                    this.dialogTitle = '编辑用户';
                    this.isEdit = true;
                    this.userForm = {
                        ...this.userForm,
                        ...user,
                        class_name: user.class_name || ''
                    };
                    this.dialogVisible = true;
                },
                saveUser() {
                    this.$refs.userForm.validate((valid) => {
                        if (!valid) {
                            return;
                        }

                        this.saveLoading = true;
                        if (this.fixedRole) {
                            this.userForm.role = this.fixedRole;
                        }
                        if (this.userForm.role === 'admin') {
                            this.userForm.class_name = '';
                        }

                        const url = this.isEdit ? `/api/user/${this.userForm.id}` : '/api/user/add';
                        const method = this.isEdit ? 'put' : 'post';

                        axios[method](url, this.userForm)
                            .then(response => {
                                if (response.data.code === 200) {
                                    this.$message.success(response.data.message);
                                    this.dialogVisible = false;
                                    this.loadClassOptions();
                                    this.loadUserList();
                                } else {
                                    this.$message.error(response.data.message);
                                }
                            })
                            .catch(error => {
                                console.error('保存用户失败:', error);
                                this.$message.error('保存用户失败');
                            })
                            .finally(() => {
                                this.saveLoading = false;
                            });
                    });
                },
                deleteUser(user) {
                    this.$confirm(`确定要删除用户“${user.nickname || user.username}”吗？`, '提示', {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }).then(() => {
                        axios.delete(`/api/user/${user.id}`)
                            .then(response => {
                                if (response.data.code === 200) {
                                    this.$message.success(response.data.message);
                                    this.loadUserList();
                                } else {
                                    this.$message.error(response.data.message);
                                }
                            })
                            .catch(error => {
                                console.error('删除用户失败:', error);
                                this.$message.error('删除用户失败');
                            });
                    });
                },
                resetForm() {
                    this.userForm = {
                        username: '',
                        password: '',
                        nickname: '',
                        email: '',
                        phone: '',
                        sex: '',
                        age: '',
                        birthday: '',
                        address: '',
                        education: '',
                        profession: '',
                        company: '',
                        class_name: '',
                        role: 'user',
                        status: 'active',
                        content: '',
                        remarks: ''
                    };
                    this.$refs.userForm && this.$refs.userForm.resetFields();
                },
                getRoleText(role) {
                    const roleMap = {
                        admin: '管理员',
                        doctor: '教师',
                        user: '学生'
                    };
                    return roleMap[role] || role;
                },
                getRoleTagType(role) {
                    const typeMap = {
                        admin: 'danger',
                        doctor: 'warning',
                        user: 'success'
                    };
                    return typeMap[role] || 'info';
                },
                getStatusText(status) {
                    const statusMap = {
                        active: '正常',
                        locked: '锁定',
                        disabled: '禁用'
                    };
                    return statusMap[status] || status;
                },
                getStatusTagType(status) {
                    const typeMap = {
                        active: 'success',
                        locked: 'warning',
                        disabled: 'danger'
                    };
                    return typeMap[status] || 'info';
                }
            },
            computed: {
                isRoleFixed() {
                    return !!this.fixedRole;
                }
            }
        });
    </script>
</body>
</html>
